<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile — ZHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <i class="bi bi-qr-code-scan display-1 text-primary mb-3"></i>
                        <h3>{{ student.user.full_name }}</h3>
                        <p class="text-muted">{{ student.user.email }}</p>

                        {% if student.qr_image_path %}
                        <img src="{{ url_for('serve_data_file', filename=student.qr_image_path) }}" alt="QR Code" class="img-fluid mb-3" style="max-width: 150px;">
                        {% endif %}

                        <hr>
                        <div class="text-start">
                            <p><strong>Phone:</strong> {{ student.user.phone or '—' }}</p>
                            <p><strong>Guardian Phone:</strong> {{ student.guardian_phone or '—' }}</p>
                        </div>

                        <hr>
                        <small class="text-muted">Scanned via ZHub Course Center QR System</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
